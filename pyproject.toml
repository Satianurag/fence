[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fence"
version = "0.1.0"
description = "Find out why code is the way it is before changing it for an issue."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fence = "fence.cli:main"

[tool.setuptools]
packages = ["fence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
